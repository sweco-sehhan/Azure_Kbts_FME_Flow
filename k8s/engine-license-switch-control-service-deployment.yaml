apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-license-switch-control-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine-license-switch-control-service
  template:
    metadata:
      labels:
        app: engine-license-switch-control-service
    spec:
      containers:
      - name: control-service
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        command:
        - python
        - /app/engine_license_switch_control_service.py
        ports:
        - containerPort: 8081
        env:
        - name: FME_FLOW_BASE_URL
          value: http://fmeflowweb:8080
        - name: FME_FLOW_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: engine-license-switch-control-service-secrets
              key: fme-flow-api-token
        - name: CONTROL_SERVICE_SHARED_TOKEN
          valueFrom:
            secretKeyRef:
              name: engine-license-switch-control-service-secrets
              key: control-service-shared-token
              optional: true
        - name: SWITCH_TIMEOUT_SECONDS
          value: "180"
        - name: POLL_INTERVAL_SECONDS
          value: "5"
        volumeMounts:
        - name: control-service-code
          mountPath: /app
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 20
      volumes:
      - name: control-service-code
        configMap:
          name: engine-license-switch-control-service-code
