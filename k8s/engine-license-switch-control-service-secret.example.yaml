apiVersion: v1
kind: Secret
metadata:
  name: engine-license-switch-control-service-secrets
type: Opaque
stringData:
  # Replace with a real FME Flow Core API token before applying.
  fme-flow-api-token: REPLACE_ME
  # Optional internal bearer token for callers of POST /switch.
  control-service-shared-token: REPLACE_ME_OPTIONAL