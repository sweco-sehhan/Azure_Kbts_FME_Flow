apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fmeflow-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: fmeflow.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fmeflow-svc
            port:
              number: 80
